services: 
  db: 
    image: postgres:16
    environment:
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
      POSTGRES_DB: flags
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata: